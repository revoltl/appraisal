plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.ruivo'
version = '0.1.1'

base {
    archivesName = 'appraisal-1.21.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven {
        name = 'NeoForgedMirror'
        url = uri('https://bmclapi2.bangbang93.com/maven')
        content {
            includeGroup 'net.neoforged'
            includeGroup 'net.minecraftforge'
            includeGroup 'cpw.mods'
            includeGroup 'net.minecraft'
        }
    }
    maven {
        name = 'NeoForged'
        url = uri('https://maven.neoforged.net/releases')
        content {
            includeGroup 'net.neoforged'
            includeGroup 'net.minecraftforge'
            includeGroup 'cpw.mods'
        }
    }
    mavenCentral()
}

neoForge {
    version = '21.1.250'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', 'appraisal', '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        appraisal {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly files('libs/ftb-ultimine-neoforge-2101.1.15.jar')
    compileOnly files('libs/architectury-13.0.11-neoforge.jar')
    compileOnly files('libs/jei-1.21.1-neoforge-19.57.0.451.jar')

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
    // 本机中文用户目录下 Gradle 测试进程无法启动，测试改用 tools/lib/junit-standalone.jar 独立执行。
    enabled = false
}

tasks.named('jar') {
    manifest {
        attributes([
                'Specification-Title'     : 'appraisal',
                'Specification-Vendor'    : 'ruivo',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'ruivo'
        ])
    }
}
